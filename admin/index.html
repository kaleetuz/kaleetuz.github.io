<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mbtswvehjtmcheocgosf.supabase.co; connect-src https://mbtswvehjtmcheocgosf.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Kaleet Admin</title>
<link rel="icon" href="favicon.png">
<style>
:root{--page:#f2f2f7;--card:#fff;--bg3:#e5e5ea;--tx:#000;--tx2:#6c6c70;--ln:rgba(60,60,67,.14);--acc:#0878b8;--acct:#06659c;--acc2:rgba(8,120,184,.12);--ok:#1e7b3c;--ok2:rgba(30,123,60,.12);--bad:#b42318;--bad2:rgba(180,35,24,.10);--warn:#8f5400;--warn2:rgba(201,122,0,.14);--inv:#fff;color-scheme:light}
:root[data-theme=dark]{--page:#000;--card:#1c1c1e;--bg3:#2c2c2e;--tx:#fff;--tx2:#98989f;--ln:rgba(235,235,245,.16);--acc:#5ac8fa;--acct:#5ac8fa;--acc2:rgba(90,200,250,.16);--ok:#4cd17a;--ok2:rgba(76,209,122,.14);--bad:#ff6b5e;--bad2:rgba(255,107,94,.14);--warn:#ffb340;--warn2:rgba(255,179,64,.14);--inv:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--tx)}
body{font-family:"SF Pro","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:400;letter-spacing:-.02em;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
h1,h2,h3{margin:0}
svg{flex:none}
.tw,.search,label,th,.lc .ph{position:relative}
.sr{position:absolute;left:0;top:0;margin:-1px;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:block;overflow:hidden;flex:none;border-radius:10px}
.logo img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
:root[data-theme=dark] .logo img{filter:invert(1);mix-blend-mode:screen}

/* layout */
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;max-width:100vw;overflow-x:hidden}
.side{min-width:0;flex:0 0 248px;max-width:248px;background:var(--card);border-right:1px solid var(--ln);padding:24px 14px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.brand b{display:block;font-size:18px;font-weight:700}.brand small{display:block;font-size:12px;color:var(--tx2)}
.nav{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--tx2);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--bg3);color:var(--tx)}
.nav a.on{background:var(--acc2);color:var(--tx);font-weight:600}.nav a.on svg{color:var(--acc)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--acc);color:var(--inv);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--page)}
.av{width:36px;height:36px;border-radius:18px;background:var(--acc2);color:var(--acct);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.me .who{flex:1;min-width:0;line-height:1.2}.me .who b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me .who small{font-size:12px;color:var(--tx2)}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1400px}
main>*{min-width:0;max-width:100%}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.hd h1{font-size:30px;font-weight:700}.hd p{margin:4px 0 0;font-size:14px;color:var(--tx2)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* controls */
.ib{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;text-decoration:none}
.ib:hover{background:var(--bg3)}.ib.ghost{background:transparent;color:var(--tx2)}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--card);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--tx);color:var(--inv)}.btn.bad{background:var(--bad2);color:var(--bad)}.btn.soft{background:var(--page)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:0;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);color:var(--inv)}.chip i{font-style:normal;opacity:.7;font-weight:500}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg3);gap:2px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:40px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);color:var(--tx2)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--tx)}
.sel{min-height:44px;padding:0 36px 0 14px;border-radius:12px;border:0;background:var(--card);font-size:14px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--tx2);font-weight:500}
.field input,.field textarea,.field select{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--page);font-size:15px;color:var(--tx);outline-color:var(--acc)}
.field textarea{padding:12px 14px;resize:vertical;min-height:88px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* cards */
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flush{padding:0;gap:0}
.card h2{font-size:18px;font-weight:700}
.card .ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.card .ch span{font-size:13px;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .l{font-size:14px;color:var(--tx2);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:34px;font-weight:700;line-height:1.1}
.kpi .s{font-size:13px;color:var(--tx2)}.kpi .s.up{color:var(--ok);font-weight:600}
.minis{background:var(--card);border-radius:20px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.minis div{display:flex;flex-direction:column;gap:4px}.minis span{font-size:13px;color:var(--tx2)}.minis b{font-size:24px;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok);display:inline-block}
.pulse{animation:p 1.8s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
.split2{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg3)}
.split2 span{display:block;height:100%}
.bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}.bar span{display:block;height:100%;border-radius:4px;background:var(--tx)}
.brow{display:flex;flex-direction:column;gap:6px}.brow .t{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.reg{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:14px}
.reg b{text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--tx2)}
.lg span{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{display:flex;align-items:flex-end;gap:4px;height:220px;border-bottom:1px solid var(--ln);padding-top:8px}
.chart .d{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart .d span{width:42%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.xl{display:flex;gap:4px;margin-top:-8px}.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--tx2);overflow:hidden}
.empty{padding:28px 20px;text-align:center;color:var(--tx2);font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--acc2);font-size:13px;line-height:1.45}
.note svg{color:var(--acct);margin-top:1px}

/* badges */
.b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok2);color:var(--ok)}.b.bad{background:var(--bad2);color:var(--bad)}.b.warn{background:var(--warn2);color:var(--warn)}.b.mut{background:var(--bg3);color:var(--tx2)}.b.acc{background:var(--acc2);color:var(--acct)}

/* table */
.tw{overflow-x:auto;max-width:100%;min-width:0}
.card>*{min-width:0}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:600;color:var(--tx2);text-align:left;padding:12px 16px;text-transform:uppercase;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--page)}
td.nw{white-space:nowrap}
.u{display:flex;align-items:center;gap:12px;text-decoration:none}
.u .ua{width:40px;height:40px;border-radius:20px;background:var(--bg3);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ua,.pa,.av{position:relative;overflow:hidden}
.avx{background:linear-gradient(180deg,var(--g1,#a5abb9),var(--g2,#7d828e)) !important;color:#fff !important;font-weight:400 !important;letter-spacing:0;line-height:1}
.avx svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.u .ua.avx{font-size:18px}.u.sm .ua.avx{font-size:13px}.prof .pa.avx{font-size:37px}.av.avx{font-size:16px}
.ua img,.pa img,.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transition:opacity .2s}
.has-ph img{opacity:1}.has-ph{color:transparent !important}
.pa.has-ph{cursor:zoom-in}
.u.sm{gap:8px;font-weight:500}.u.sm .ua{width:28px;height:28px;border-radius:14px;font-size:11px}
.u b{display:block;font-weight:600}.u small{display:block;font-size:13px;color:var(--tx2)}
.mut{color:var(--tx2)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--ln);font-size:14px;color:var(--tx2)}

/* listings */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.lc{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lc .ph{position:relative;aspect-ratio:16/10;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.lc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lc .ph .b{position:absolute;left:12px;top:12px}
.lc .ph .n{position:absolute;right:12px;bottom:12px;height:26px;padding:0 10px;border-radius:13px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.lc .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.lc h3{font-size:17px;font-weight:700;line-height:1.3}
.lc .pr{font-size:20px;font-weight:700}
.lc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--tx2);margin-top:auto;padding-top:8px;border-top:1px solid var(--ln)}
.lc .ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--ln);overflow-x:auto}
.tab{border:0;background:transparent;min-height:44px;padding:0 4px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--tx2);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tab.on{color:var(--tx);border-bottom-color:var(--acc)}

/* profile */
.prof{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.prof .pa{width:80px;height:80px;border-radius:40px;background:var(--bg3);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.prof h1{font-size:28px;font-weight:700;overflow-wrap:anywhere}
dl.kv{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);margin:0}
dl.kv dt,dl.kv dd{margin:0;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px}
dl.kv dt{color:var(--tx2)}dl.kv dd{font-weight:500;overflow-wrap:anywhere}
dl.kv dt:last-of-type,dl.kv dd:last-of-type{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat4 div{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
.stat4 span{font-size:13px;color:var(--tx2)}.stat4 b{font-size:26px;font-weight:700}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}.li small{display:block;font-size:13px;color:var(--tx2)}
.tl{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--ln)}
.tl:last-child{border-bottom:0}.tl i{width:10px;height:10px;border-radius:5px;margin-top:6px;background:var(--tx2)}
.tl small{display:block;font-size:13px;color:var(--tx2)}.tl time{font-size:13px;color:var(--tx2);white-space:nowrap}
.box{background:var(--page);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.box small{font-size:12px;color:var(--tx2)}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;padding:24px 16px}
.login .top{display:flex;justify-content:flex-end}
.login .mid{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 0}
.lcard{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:40px 32px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.lcard h1{font-size:30px;font-weight:700}.lcard h1 span{color:var(--acct)}
.lcard p{margin:8px 0 0;color:var(--tx2)}
.lcard form{width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}
.lcard .field input{min-height:52px;font-size:16px;border-radius:14px}
.pw{position:relative;display:flex}.pw input{flex:1;min-width:0;padding-right:52px !important}
.pw .ib{position:absolute;right:4px;top:4px;background:transparent;color:var(--tx2)}
.err{padding:12px 14px;border-radius:14px;background:var(--bad2);color:var(--bad);font-size:13px;font-weight:600}
.lcard .btn{min-height:52px;font-size:16px;border-radius:14px}
.foot{text-align:center;font-size:13px;color:var(--tx2);margin:0}

/* dialog + toast */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg .in{width:100%;max-width:440px;background:var(--card);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:20px;font-weight:700}.dlg p{margin:0;color:var(--tx2);font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--inv);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mob{display:none !important}
.loading{padding:60px 0;text-align:center;color:var(--tx2)}
.link{color:var(--acct);text-decoration:none;font-weight:600}.link:hover{text-decoration:underline}

@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
 .side{flex:1 1 100%;max-width:none;border-right:0;border-bottom:1px solid var(--ln);padding:12px 16px;gap:10px}
 .nav{flex-direction:row;overflow-x:auto;gap:6px}.nav a{flex:0 0 auto}
 .me{display:none}
 .mob{display:inline-flex !important}
 main{padding:20px 16px 40px}
 .hd h1{font-size:26px}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .kpi .v{font-size:28px}
 .reg{grid-template-columns:90px minmax(0,1fr) 48px}
}
</style>
</head>
<body>
<div id="root"><div class="loading">Yuklanmoqda…</div></div>
<script src="app.js"></script>
</body>
</html>
